rules:
  - name: "SSH Brute Force Attempt"
    description: "Geçersiz kullanıcı veya hatalı şifre ile çoklu giriş denemesi."
    severity: "HIGH"
    log_type: "auth"
    regex: "Failed password for (invalid user )?(\\S+) from (\\d+\\.\\d+\\.\\d+\\.\\d+)"

  - name: "SSH Successful Root Login"
    description: "Root kullanıcısı uzaktan başarılı giriş yaptı."
    severity: "CRITICAL"
    log_type: "auth"
    regex: "Accepted (password|publickey) for root from"

  - name: "Sudo Privilege Escalation"
    description: "Bir kullanıcı yetkili haklarla (SUDO) komut çalıştırdı."
    severity: "MEDIUM"
    log_type: "auth"
    regex: "COMMAND=.*"

  - name: "New User Creation"
    description: "Sistemde yeni bir kullanıcı oluşturuldu."
    severity: "HIGH"
    log_type: "auth"
    regex: "new user: name=(\\w+)"

  - name: "SQL Injection Attempt"
    description: "URL içinde SQL enjeksiyonu saldırı imzası tespit edildi."
    severity: "CRITICAL"
    log_type: "nginx"
    regex: "UNION.*SELECT|SELECT.*FROM|OR.*1=1|%27|%22"

  - name: "XSS (Cross Site Scripting)"
    description: "Zararlı JavaScript kodu çalıştırma girişimi."
    severity: "HIGH"
    log_type: "nginx"
    regex: "<script>|javascript:|onerror=|onload="

  - name: "Directory Traversal"
    description: "Dizin geçişi ile sistem dosyalarına erişim denemesi."
    severity: "CRITICAL"
    log_type: "nginx"
    regex: "\\.\\./\\.\\./|/etc/passwd|/windows/win.ini"

  - name: "Web Scanner/Bot Probe"
    description: "Otomatik tarayıcılar tarafından bilinmeyen dosya taraması."
    severity: "LOW"
    log_type: "nginx"
    regex: "GET .* HTTP/1.1\" 404"

  - name: "Critical System Failure"
    description: "Çekirdek veya sistem servisinde kritik hata oluştu."
    severity: "MEDIUM"
    log_type: "syslog"
    regex: "error|critical|fatal|panic"

  - name: "USB Device Connected"
    description: "Sisteme yeni bir USB cihazı takıldı."
    severity: "LOW"
    log_type: "syslog"
    regex: "New USB device found"